name: Request Unity activation file (run once)

# One-time setup step: produces a .alf file you upload to
# https://license.unity3d.com/manual to get back a .ulf license file. Put that
# .ulf file's full text content into the UNITY_LICENSE repo secret - after
# that, this workflow is never needed again (delete it or leave it, harmless).

on:
  workflow_dispatch: {}

jobs:
  request-activation-file:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-request-activation-file@v2
        id: request
      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.request.outputs.filePath }}
