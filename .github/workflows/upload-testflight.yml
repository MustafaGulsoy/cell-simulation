name: Upload latest iOS build to TestFlight

# Fetches the most recent successful Unity Cloud Build iOS artifact and uploads
# it to TestFlight via fastlane. Runs on a GitHub-hosted macOS runner so no Mac
# is needed on our end - Xcode command line tools + fastlane come preinstalled.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   UCB_API_KEY          Unity Cloud Build API key (Unity Cloud dashboard >
#                         org settings > DevOps > Api Key)
#   UCB_ORG_ID            Unity Cloud organization id
#   UCB_PROJECT_ID        Unity Cloud project id
#   UCB_BUILDTARGET_ID    The iOS build target's id (visible in its Cloud Build URL)
#   ASC_KEY_ID            App Store Connect API Key ID
#   ASC_ISSUER_ID         App Store Connect API Issuer ID
#   ASC_API_KEY_P8        Full contents of the downloaded .p8 private key file
#
# NOTE: this was written without a live Unity Cloud Build account to verify
# against, from Unity's documented REST API shape. The "Find latest successful
# build" step's JSON field path (links.download_primary.href) is the
# documented v1 response shape - if Unity has since changed it, that step is
# the one to inspect/fix (run it manually once with `curl -v` to see the
# actual response before editing the python one-liner).

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [unity-cloud-build-success]

jobs:
  upload-testflight:
    runs-on: macos-latest
    steps:
      - name: Find + download latest successful iOS build
        env:
          UCB_API_KEY: ${{ secrets.UCB_API_KEY }}
          UCB_ORG_ID: ${{ secrets.UCB_ORG_ID }}
          UCB_PROJECT_ID: ${{ secrets.UCB_PROJECT_ID }}
          UCB_BUILDTARGET_ID: ${{ secrets.UCB_BUILDTARGET_ID }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UCB_API_KEY" | base64)

          BUILD_JSON=$(curl -sf \
            -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/$UCB_ORG_ID/projects/$UCB_PROJECT_ID/buildtargets/$UCB_BUILDTARGET_ID/builds/?buildStatus=success&per_page=1")

          echo "$BUILD_JSON" > /tmp/build.json
          DOWNLOAD_URL=$(python3 -c "
          import json
          d = json.load(open('/tmp/build.json'))[0]
          print(d['links']['download_primary']['href'])
          ")

          curl -sfL -H "Authorization: Basic $AUTH" -o BlobRush.ipa "$DOWNLOAD_URL"
          ls -la BlobRush.ipa

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os
          key = {
              'key_id': os.environ['ASC_KEY_ID'],
              'issuer_id': os.environ['ASC_ISSUER_ID'],
              'key': os.environ['ASC_API_KEY_P8'],
              'in_house': False,
          }
          json.dump(key, open('/tmp/asc_api_key.json', 'w'))
          "

          fastlane pilot upload \
            --ipa BlobRush.ipa \
            --api_key_path /tmp/asc_api_key.json \
            --skip_waiting_for_build_processing true
